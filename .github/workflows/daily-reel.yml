name: Daily horror reel

on:
  schedule:
    # 13:17 UTC = 6:47 PM IST, every day. GitHub may start scheduled runs a few minutes late.
    # Change it with https://crontab.guru (times are UTC; IST = UTC + 5:30).
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = quick 30 s sample · dry_run = full reel, not posted · post = make and post"
        type: choice
        options: [preview, dry_run, post]
        default: preview

permissions:
  contents: write   # lets the run save its memory (state/: series progress + character portraits)

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache the depth model (downloaded once, ~25-100 MB)
        uses: actions/cache@v4
        with:
          path: .cache
          key: depth-anything-v2-small-v1

      - name: Run the agent team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ secrets.IG_API_HOST }}
          X264_PRESET: medium
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'post' }}
        run: python main.py

      - name: Keep the reel for 7 days (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save memory
        if: success()
        run: |
          git config user.name "night-stories-bot"
          git config user.email "night-stories-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "memory: $(date -u +%F)" && git push)
