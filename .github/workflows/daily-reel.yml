name: Daily horror reel

on:
  schedule:
    # 15:47 UTC = 9:17 PM IST, every day (peak time for Hindi horror). The run takes ~30 min, so the
    # reel goes live around 9:45 PM. GitHub may start scheduled runs a few minutes late.
    # Change it with https://crontab.guru (times are UTC; IST = UTC + 5:30).
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = quick 30 s sample · dry_run = full reel, not posted · post = make and post · gpu_setup = download the GPU models once + test them"
        type: choice
        options: [preview, dry_run, post, gpu_setup]
        default: preview

permissions:
  contents: write   # lets the run save its memory (state/: series progress + character portraits)

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        # libomp5 + Mesa's CPU Vulkan driver let the Real-ESRGAN upscaler run without a GPU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libomp5 libvulkan1 mesa-vulkan-drivers

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache the depth model (downloaded once, ~25-100 MB)
        uses: actions/cache@v4
        with:
          path: .cache
          key: depth-anything-v2-small-v1

      - name: Deploy the GPU engine (only if Modal is set up)
        if: env.MODAL_TOKEN_ID != ''
        continue-on-error: true      # without it the reel is still made the normal way
        run: pip install -q "modal>=1.6,<2" && modal deploy gpu_app.py

      - name: Run the agent team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ secrets.IG_API_HOST }}
          X264_PRESET: medium
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'post' }}
        run: python main.py

      # Saved first, so a full artifact store can never make the system forget what it posted.
      - name: Save memory
        if: success()
        run: |
          git config user.name "night-stories-bot"
          git config user.email "night-stories-bot@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "memory: $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          fi

      - name: Keep the reel for 3 days (download from this run's page)
        if: always()
        continue-on-error: true      # free accounts have 500 MB of artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore
