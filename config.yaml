# ─────────────────────────────────────────────────────────────
#  3AM Tales — multi-agent Instagram Reel system
#  Edit this file to change the niche, voice, look or schedule.
#  (The posting time itself lives in .github/workflows/daily-reel.yml)
# ─────────────────────────────────────────────────────────────

channel:
  name: "3AM Tales"
  audience: "Gen Z (16-26), watches on phone at night, loves twists, hates slow intros"
  cta: "Follow for a new story every night 🕯️"
  language: "English"

# The Researcher agent rotates between these formats and learns which
# ones perform best once your account has a few posts with insights.
formats:
  - id: creepy_story
    label: "Original creepy story"
    brief: "An original first-person horror story with a slow-burn build and a twist in the final line. Fiction."
  - id: rules_horror
    label: "Rules horror"
    brief: "A list of strange rules for a job, place or situation (e.g. night shift at a motel), told by someone who broke one. Fiction."
  - id: unsettling_fact
    label: "Unsettling real mystery"
    brief: "A widely documented real-world mystery, phenomenon or creepy fact, told like a campfire story. Must be factually accurate; no named private individuals; hedge anything uncertain."

llm:
  # Free-tier Gemini models. If the first one is unavailable or rate-limited
  # the system falls back to the next. Override with the GEMINI_MODEL secret.
    model: "gemini-3.8-flash"
    fallback_models: ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-flash-latest"]

story:
  min_words: 110          # ~45 s of narration
  max_words: 150          # ~60 s of narration
  min_critic_score: 75    # out of 100 — below this the Writer revises
  max_revisions: 2
  max_ideas_per_run: 3    # if a story fails safety/quality, try a fresh idea

voice:
  # Free Microsoft neural voices via edge-tts. Good deep options:
  # en-US-ChristopherNeural, en-US-GuyNeural, en-GB-RyanNeural, en-US-AndrewNeural
  name: "en-US-ChristopherNeural"
  rate: "-6%"
  pitch: "-5Hz"

video:
  width: 1080
  height: 1920
  fps: 30
  lead_in_seconds: 0.4
  tail_seconds: 1.2
  grade: "eq=brightness=-0.04:contrast=1.08:saturation=0.72"   # moody but still natural-looking
  grain: true
  drone_volume: 0.07       # eerie background drone (generated, no copyright)
  subtitle_font: "DejaVu Sans"
  subtitle_size: 84
  hook_color: "#FF3B3B"    # first line of every reel
  # Fallback stock-footage searches when a scene's keywords return nothing
  fallback_queries:
    - "dark forest night"
    - "abandoned hallway"
    - "foggy road night"
    - "flickering light dark room"
    - "old house night"
    - "empty street night rain"

caption:
  max_hashtags: 8
  core_hashtags: ["#horrorstories", "#scarystories", "#creepy", "#storytime"]

instagram:
  # graph.instagram.com  → "Instagram API with Instagram Login" (no Facebook Page needed)
  # graph.facebook.com   → "Instagram API with Facebook Login" (account linked to a Page)
  api_host: "graph.instagram.com"
  api_version: "v23.0"
